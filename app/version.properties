# App version, advanced automatically by Gradle after every successful assemble/bundle build
# (see the bumpVersionCode task in app/build.gradle.kts).
# VERSION_NAME (major.minor.patch) rolls over: 1.18.9 -> 1.19.0, 1.99.9 -> 2.0.0.
# VERSION_CODE is Android's upgrade number: it only ever goes up, never lower it.
VERSION_NAME=1.18.8
VERSION_CODE=8
